name: Deploy public dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public_site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Validate forecast exports
        run: python validate_dashboard.py

      - name: Reject changed locked picks and unexplained coverage loss
        run: python publication_gate.py --against HEAD^

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
