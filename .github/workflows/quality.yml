name: Model and dashboard validation
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -B -m unittest discover -p 'test*.py'
      - run: python validate_dashboard.py
      - run: python validate_delivery.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node public_site/build.mjs
      - run: node --test public_site/test_delivery.mjs public_site/test_navigation.mjs public_site/test_lazy_view.mjs
